<section class="modulex-faq">
  <div class="modulex-faq-container">
    <div class="modulex-faq-header">
      <div class="modulex-faq-badge">{{badge}}</div>
      <h2 class="modulex-faq-title">{{title}}</h2>
      <p class="modulex-faq-desc">{{description}}</p>
    </div>
    <div class="modulex-faq-list">
      {{html}}
    </div>
  </div>
</section>

<style>
  .modulex-faq {
    width: 100%;
    padding: 80px 20px;
    background: --bgcolor--;
    box-sizing: border-box;
  }

  .modulex-faq-container {
    max-width: --max--;
    margin: 0 auto;
  }

  .modulex-faq-header {
    text-align: center;
    margin-bottom: 48px;
  }

  .modulex-faq-badge {
    display: inline-block;
    padding: 6px 18px;
    background: --accent--;
    color: #fff;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .modulex-faq-title {
    font-size: 36px;
    font-weight: 800;
    color: --titlecolor--;
    margin: 0 0 12px;
  }

  .modulex-faq-desc {
    font-size: 16px;
    color: --textcolor--;
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .modulex-faq-list {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modulex-faq-item {
    background: --cardbg--;
    border: 1px solid --bordercolor--;
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .modulex-faq-item.modulex-faq-open {
    border-color: --accent--;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  }

  .modulex-faq-question {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 18px 22px;
    min-height: 44px;
    background: transparent;
    border: none;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    color: --titlecolor--;
    cursor: pointer;
    box-sizing: border-box;
  }

  .modulex-faq-question .material-symbols-outlined {
    flex-shrink: 0;
    transition: transform 0.3s ease;
    color: --accent--;
  }

  .modulex-faq-open .modulex-faq-question .material-symbols-outlined {
    transform: rotate(180deg);
  }

  .modulex-faq-answer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s ease;
  }

  .modulex-faq-open .modulex-faq-answer {
    grid-template-rows: 1fr;
  }

  .modulex-faq-answer-inner {
    min-height: 0;
    overflow: hidden;
    padding: 0 22px;
    font-size: 15px;
    line-height: 1.75;
    color: --textcolor--;
  }

  .modulex-faq-answer-inner::after {
    content: "";
    display: block;
    height: 20px;
  }

  @keyframes modulexFaqIn {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .modulex-faq-item {
    animation: modulexFaqIn 0.5s ease both;
  }

  @media (max-width: 768px) {
    .modulex-faq {
      padding: 48px 14px;
    }

    .modulex-faq-title {
      font-size: 26px;
    }

    .modulex-faq-question {
      font-size: 15px;
      padding: 16px 16px;
    }

    .modulex-faq-answer-inner {
      padding: 0 16px;
    }

    .modulex-faq-answer-inner::after {
      height: 16px;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<script>
  function modulexFaqToggle(btn) {
    var item = btn.parentElement;
    var isOpen = item.classList.contains("modulex-faq-open");
    var list = item.parentElement.children;
    var i;
    for (i = 0; i < list.length; i++) {
      list[i].classList.remove("modulex-faq-open");
      var otherBtn = list[i].querySelector(".modulex-faq-question");
      if (otherBtn) {
        otherBtn.setAttribute("aria-expanded", "false");
      }
    }
    if (!isOpen) {
      item.classList.add("modulex-faq-open");
      btn.setAttribute("aria-expanded", "true");
    }
  }
</script>
