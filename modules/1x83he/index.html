<section class="modulex-pricing">
  <div class="modulex-pricing-container">
    <div class="modulex-pricing-header">
      <div class="modulex-pricing-badge">{{badge}}</div>
      <h2 class="modulex-pricing-title">{{title}}</h2>
      <p class="modulex-pricing-desc">{{description}}</p>
    </div>
    <div class="modulex-pricing-grid">
      {{html}}
    </div>
  </div>
</section>

<style>
  .modulex-pricing {
    width: 100%;
    padding: 80px 20px;
    background: --bgcolor--;
    box-sizing: border-box;
  }

  .modulex-pricing-container {
    max-width: --max--;
    margin: 0 auto;
  }

  .modulex-pricing-header {
    text-align: center;
    margin-bottom: 48px;
  }

  .modulex-pricing-badge {
    display: inline-block;
    padding: 6px 18px;
    background: --accent--;
    color: #fff;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .modulex-pricing-title {
    font-size: 36px;
    font-weight: 800;
    color: --titlecolor--;
    margin: 0 0 12px;
  }

  .modulex-pricing-desc {
    font-size: 16px;
    color: --textcolor--;
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .modulex-pricing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
    align-items: stretch;
  }

  .modulex-pricing-card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: --cardbg--;
    border: 1px solid --bordercolor--;
    border-radius: 16px;
    padding: 32px 26px;
    box-sizing: border-box;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: modulexPricingIn 0.5s ease both;
  }

  .modulex-pricing-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
  }

  .modulex-pricing-card.modulex-pricing-featured {
    border: 2px solid --accent--;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.1);
  }

  .modulex-pricing-flag {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: --accent--;
    color: #fff;
    padding: 4px 16px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .modulex-pricing-plan {
    font-size: 18px;
    font-weight: 700;
    color: --titlecolor--;
    margin: 0 0 8px;
  }

  .modulex-pricing-price {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 6px;
  }

  .modulex-pricing-amount {
    font-size: 40px;
    font-weight: 800;
    color: --accent--;
    line-height: 1;
  }

  .modulex-pricing-period {
    font-size: 14px;
    color: --textcolor--;
  }

  .modulex-pricing-note {
    font-size: 13px;
    color: --textcolor--;
    margin: 0 0 20px;
  }

  .modulex-pricing-features {
    list-style: none;
    margin: 0 0 26px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .modulex-pricing-features li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: --textcolor--;
  }

  .modulex-pricing-features .material-symbols-outlined {
    font-size: 18px;
    color: --accent--;
    flex-shrink: 0;
  }

  .modulex-pricing-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 12px 24px;
    border-radius: 10px;
    background: --accent--;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: filter 0.25s ease, transform 0.25s ease;
    box-sizing: border-box;
  }

  .modulex-pricing-cta:hover {
    filter: brightness(1.08);
    transform: translateY(-2px);
  }

  @keyframes modulexPricingIn {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 768px) {
    .modulex-pricing {
      padding: 48px 14px;
    }

    .modulex-pricing-title {
      font-size: 26px;
    }

    .modulex-pricing-grid {
      grid-template-columns: 1fr;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
