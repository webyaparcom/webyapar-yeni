<section class="modulex-rf" id="rf-{{id}}" aria-labelledby="rf-{{id}}-baslik">
  <div class="modulex-rf-wrap">
    <header class="modulex-rf-head">
      <span class="modulex-rf-badge">{{badge}}</span>
      <h2 class="modulex-rf-title" id="rf-{{id}}-baslik">{{title}}</h2>
      <p class="modulex-rf-desc">{{description}}</p>
    </header>

    <div class="modulex-rf-card" data-rf="card">
      <nav class="modulex-rf-stepsnav" aria-label="{{ui:stepsLabel}}">
        <ol class="modulex-rf-steps" data-rf="steps"></ol>
      </nav>
      <p class="modulex-rf-stepof" data-rf="stepof"></p>
      <div class="modulex-rf-panel" data-rf="panel"></div>
      <p class="modulex-rf-status" data-rf="status" role="status" aria-live="polite"></p>
      <div class="modulex-rf-nav" data-rf="nav"></div>
      <noscript><p class="modulex-rf-noscript">{{noscript}}</p></noscript>
    </div>

    <section class="modulex-rf-my" data-rf="my" hidden></section>
    <script type="application/json" id="rf-{{id}}-veri">{{veri}}</script>
  </div>
</section>

<style>
  .modulex-rf {
    --rf-bg: --bgcolor--;
    --rf-text: --textcolor--;
    --rf-surface: --surface--;
    --rf-surface2: --surface2--;
    --rf-accent: --accent--;
    --rf-accent-text: --accentText--;
    --rf-border: --bordercolor--;
    --rf-muted: --muted--;
    --rf-err: --errcolor--;
    --rf-sel: color-mix(in srgb, var(--rf-accent) 12%, var(--rf-surface));
    box-sizing: border-box;
    width: 100%;
    padding: 72px 20px;
    background: var(--rf-bg);
    color: var(--rf-text);
  }
  .modulex-rf *,
  .modulex-rf *::before,
  .modulex-rf *::after { box-sizing: border-box; }

  .modulex-rf-wrap { max-width: --max--; margin-inline: auto; }
  .modulex-rf-head { text-align: center; margin-block-end: 36px; }
  .modulex-rf-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid var(--rf-border);
    background: var(--rf-surface);
    color: var(--rf-text);
    font-size: 13px;
    font-weight: 600;
    margin-block-end: 14px;
  }
  .modulex-rf-title { margin: 0 0 10px; font-size: clamp(26px, 4vw, 38px); line-height: 1.2; font-weight: 700; color: var(--rf-text); }
  .modulex-rf-desc { margin: 0 auto; max-width: 620px; font-size: 16px; line-height: 1.7; color: var(--rf-muted); }

  .modulex-rf-card {
    background: var(--rf-surface);
    border: 1px solid var(--rf-border);
    border-radius: 20px;
    padding: 28px;
  }

  /* adım göstergesi */
  .modulex-rf-steps { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: center; }
  .modulex-rf-step-i { display: flex; align-items: center; gap: 8px; color: var(--rf-muted); font-size: 14px; }
  .modulex-rf-step-i + .modulex-rf-step-i::before {
    content: "";
    width: 22px;
    height: 2px;
    background: var(--rf-border);
    margin-inline-end: 2px;
  }
  .modulex-rf-step-btn,
  .modulex-rf-step-cur,
  .modulex-rf-step-todo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 6px;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  .modulex-rf-step-btn { cursor: pointer; border-radius: 10px; transition: background 0.2s ease; }
  .modulex-rf-step-btn:hover { background: var(--rf-surface2); }
  .modulex-rf-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--rf-border);
    font-size: 13px;
    font-weight: 700;
    color: var(--rf-muted);
    flex: none;
  }
  .modulex-rf-dot .material-symbols-outlined { font-size: 18px; }
  .modulex-rf-step-cur { color: var(--rf-text); font-weight: 700; }
  .modulex-rf-step-cur .modulex-rf-dot { background: var(--rf-accent); border-color: var(--rf-accent); color: var(--rf-accent-text); }
  .modulex-rf-step-done .modulex-rf-dot { border-color: var(--rf-accent); color: var(--rf-accent); }
  .modulex-rf-stepof { display: none; margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--rf-muted); }

  .modulex-rf-panel { min-height: 280px; }
  .modulex-rf-step { animation: modulexRfIn 0.28s ease both; }
  @keyframes modulexRfIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .modulex-rf-h { margin: 0 0 16px; font-size: 20px; font-weight: 700; line-height: 1.3; color: var(--rf-text); }
  .modulex-rf-h:focus { outline: none; }

  /* seçim kartları (radyo) */
  .modulex-rf-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .modulex-rf-opt {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 12px 16px;
    border: 2px solid var(--rf-border);
    border-radius: 14px;
    background: var(--rf-bg);
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .modulex-rf-opt:hover { border-color: var(--rf-accent); }
  .modulex-rf-opt:has(input:focus-visible) { outline: 3px solid var(--rf-accent); outline-offset: 2px; }
  .modulex-rf-opt-on { border-color: var(--rf-accent); background: var(--rf-sel); }
  .modulex-rf-opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .modulex-rf-opt-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .modulex-rf-opt-name { font-weight: 600; font-size: 16px; line-height: 1.35; color: var(--rf-text); }
  .modulex-rf-opt-meta { font-size: 14px; color: var(--rf-muted); }
  .modulex-rf-opt-check { visibility: hidden; color: var(--rf-accent); flex: none; }
  .modulex-rf-opt-on .modulex-rf-opt-check { visibility: visible; }
  .modulex-rf-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--rf-surface2);
    color: var(--rf-text);
    font-weight: 700;
    flex: none;
  }

  /* kişi sayısı */
  .modulex-rf-party { display: flex; align-items: center; gap: 14px; margin-block-end: 20px; }
  .modulex-rf-partyval { min-width: 140px; text-align: center; font-size: 24px; font-weight: 700; color: var(--rf-text); }
  .modulex-rf-hint a { display: inline-block; color: var(--rf-accent); font-weight: 600; }
  .modulex-rf-hint-c { text-align: center; }
  .modulex-rf-done .modulex-rf-h { margin-block-start: 8px; }
  .modulex-rf-hint { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--rf-muted); }
  .modulex-rf-subh { margin: 22px 0 12px; font-size: 16px; font-weight: 700; color: var(--rf-text); }

  /* takvim */
  .modulex-rf-calbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-block-end: 8px; }
  .modulex-rf-month { font-size: 18px; font-weight: 700; text-align: center; flex: 1; text-transform: capitalize; }
  .modulex-rf-grid { width: 100%; max-width: 460px; margin-inline: auto; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
  .modulex-rf-grid th { padding: 6px 0; font-size: 13px; font-weight: 600; color: var(--rf-muted); text-align: center; }
  .modulex-rf-grid td { padding: 0; text-align: center; }
  .modulex-rf-wd-n { display: none; }
  .modulex-rf-day {
    width: 100%;
    min-height: 44px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: var(--rf-bg);
    color: var(--rf-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .modulex-rf-day:hover { border-color: var(--rf-accent); }
  .modulex-rf-day:focus-visible { outline: 3px solid var(--rf-accent); outline-offset: 2px; }
  .modulex-rf-day-today { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-rf-day-off {
    background: transparent;
    color: var(--rf-muted);
    font-weight: 400;
    cursor: not-allowed;
    opacity: 0.45;
  }
  .modulex-rf-day-off:hover { border-color: transparent; }
  .modulex-rf-day-sel,
  .modulex-rf-day-sel:hover { background: var(--rf-accent); border-color: var(--rf-accent); color: var(--rf-accent-text); text-decoration: none; opacity: 1; }
  .modulex-rf-chosen { margin: 14px 0 0; text-align: center; font-weight: 600; min-height: 1.5em; }

  /* saat dilimleri */
  .modulex-rf-slotgroup { margin-block-end: 18px; }
  .modulex-rf-slotlabel { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--rf-muted); }
  .modulex-rf-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .modulex-rf-slot {
    min-height: 44px;
    padding-inline: 10px;
    border: 2px solid var(--rf-border);
    border-radius: 12px;
    background: var(--rf-bg);
    color: var(--rf-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .modulex-rf-slot:hover { border-color: var(--rf-accent); }
  .modulex-rf-slot:focus-visible { outline: 3px solid var(--rf-accent); outline-offset: 2px; }
  .modulex-rf-slot[aria-pressed="true"] { background: var(--rf-accent); border-color: var(--rf-accent); color: var(--rf-accent-text); }
  .modulex-rf-slot:disabled { cursor: not-allowed; opacity: 0.55; }
  .modulex-rf-slot small { display: block; font-size: 11px; font-weight: 400; text-decoration: none; }

  /* form alanları */
  .modulex-rf-fields { display: grid; gap: 16px; max-width: 560px; }
  .modulex-rf-label { display: block; margin-block-end: 6px; font-size: 14px; font-weight: 600; color: var(--rf-text); }
  .modulex-rf-input {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    border: 2px solid var(--rf-border);
    border-radius: 12px;
    background: var(--rf-bg);
    color: var(--rf-text);
    font: inherit;
    transition: border-color 0.2s ease;
  }
  textarea.modulex-rf-input { min-height: 96px; resize: vertical; }
  .modulex-rf-input:focus-visible { outline: 3px solid var(--rf-accent); outline-offset: 1px; border-color: var(--rf-accent); }
  .modulex-rf-input[aria-invalid="true"] { border-color: var(--rf-err); }
  [dir="rtl"] .modulex-rf-ltr { text-align: end; }
  .modulex-rf-err { margin: 6px 0 0; font-size: 14px; font-weight: 600; color: var(--rf-err); }
  .modulex-rf-err[hidden] { display: none; }
  .modulex-rf-reqnote { margin: 4px 0 0; font-size: 13px; color: var(--rf-muted); }

  /* özet */
  .modulex-rf-sum { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0 0 20px; padding: 18px; border: 1px solid var(--rf-border); border-radius: 14px; background: var(--rf-bg); }
  .modulex-rf-sum dt { font-size: 14px; color: var(--rf-muted); }
  .modulex-rf-sum dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .modulex-rf-kvkk { display: flex; align-items: flex-start; gap: 12px; }
  .modulex-rf-kvkk input { flex: none; width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--rf-accent); cursor: pointer; }
  .modulex-rf-kvkk label { line-height: 1.6; font-size: 15px; cursor: pointer; }
  .modulex-rf-kvkk a { color: var(--rf-accent); font-weight: 600; text-decoration: underline; }
  .modulex-rf-note { padding: 14px 16px; border-radius: 12px; border: 1px dashed var(--rf-border); background: var(--rf-bg); line-height: 1.6; }

  /* düğmeler */
  .modulex-rf-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 120px;
    min-height: 48px;
    padding-inline: 22px;
    border: 2px solid var(--rf-accent);
    border-radius: 12px;
    background: var(--rf-accent);
    color: var(--rf-accent-text);
    font: inherit;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .modulex-rf-btn:hover { transform: translateY(-1px); }
  .modulex-rf-btn:focus-visible { outline: 3px solid var(--rf-text); outline-offset: 2px; }
  .modulex-rf-btn-ghost { background: transparent; color: var(--rf-text); border-color: var(--rf-border); }
  .modulex-rf-btn-ghost:hover { border-color: var(--rf-accent); }
  a.modulex-rf-btn { color: var(--rf-accent-text); }
  a.modulex-rf-btn-ghost { color: var(--rf-text); }
  .modulex-rf-iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 2px solid var(--rf-border);
    border-radius: 12px;
    background: var(--rf-bg);
    color: var(--rf-text);
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .modulex-rf-iconbtn:hover { border-color: var(--rf-accent); }
  .modulex-rf-iconbtn:focus-visible { outline: 3px solid var(--rf-accent); outline-offset: 2px; }
  .modulex-rf-iconbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .modulex-rf-nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; margin-block-start: 24px; }
  .modulex-rf-nav:empty { display: none; }
  .modulex-rf-status { min-height: 1.5em; margin: 14px 0 0; font-weight: 600; }
  .modulex-rf-status-bad { color: var(--rf-err); }
  .modulex-rf-noscript { margin: 0; padding: 14px; line-height: 1.6; }

  /* başarı + randevularım */
  .modulex-rf-done { text-align: center; }
  .modulex-rf-doneic { font-size: 56px; color: var(--rf-accent); }
  .modulex-rf-done .modulex-rf-sum { text-align: start; margin-inline: auto; max-width: 520px; }
  .modulex-rf-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-block-start: 8px; }
  .modulex-rf-my { margin-block-start: 28px; padding: 24px; border: 1px solid var(--rf-border); border-radius: 20px; background: var(--rf-surface); }
  .modulex-rf-my h3 { margin: 0 0 14px; font-size: 18px; font-weight: 700; }
  .modulex-rf-mylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .modulex-rf-myitem { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--rf-border); border-radius: 12px; background: var(--rf-bg); }
  .modulex-rf-mytext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .modulex-rf-mytext span:last-child { font-size: 14px; color: var(--rf-muted); }

  @media (max-width: 768px) {
    .modulex-rf { padding: 44px 14px; }
    .modulex-rf-card { padding: 18px 14px; border-radius: 16px; }
    .modulex-rf-steps { display: none; }
    .modulex-rf-stepof { display: block; }
    .modulex-rf-cards { grid-template-columns: 1fr; }
    .modulex-rf-nav .modulex-rf-btn { flex: 1; min-width: 0; }
    .modulex-rf-sum { grid-template-columns: 1fr; gap: 2px; }
    .modulex-rf-sum dd { margin-block-end: 8px; }
    .modulex-rf-wd-s { display: none; }
    .modulex-rf-wd-n { display: inline; }
    .modulex-rf-my { padding: 16px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-rf *,
    .modulex-rf *::before,
    .modulex-rf *::after { animation: none; transition: none; }
  }
</style>

<script>
(function () {
  "use strict";

  /*PURE-BEGIN*/
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function isoOf(y, m, d) { return y + "-" + pad2(m) + "-" + pad2(d); }
  function parseIso(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
    if (!m) { return null; }
    var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    var t = new Date(Date.UTC(y, mo - 1, d));
    if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) { return null; }
    return { y: y, m: mo, d: d };
  }
  function utcOf(iso) { var p = parseIso(iso); return Date.UTC(p.y, p.m - 1, p.d); }
  function isoFromUtc(ms) { var t = new Date(ms); return isoOf(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
  function addDays(iso, n) { return isoFromUtc(utcOf(iso) + n * 86400000); }
  function diffDays(a, b) { return Math.round((utcOf(a) - utcOf(b)) / 86400000); }
  /* ISO hafta günü: Pazartesi=1 … Pazar=7 */
  function isoWeekday(iso) { var w = new Date(utcOf(iso)).getUTCDay(); return w === 0 ? 7 : w; }
  function hmToMin(s) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(s || ""));
    return m ? Number(m[1]) * 60 + Number(m[2]) : NaN;
  }
  function minToHm(n) { return pad2(Math.floor(n / 60)) + ":" + pad2(n % 60); }
  /* hafta başlangıcı: "sat" → 6, "sun" → 7, diğer → 1 (Pazartesi) */
  function haftaBasi(k) { return k === "sat" ? 6 : (k === "sun" ? 7 : 1); }
  /* "" = seçilebilir; aksi halde neden: past | lead | far | closed | day */
  function gunDurum(cfg, iso, bugun) {
    var fark = diffDays(iso, bugun);
    if (fark < 0) { return "past"; }
    if (fark < cfg.leadDays) { return "lead"; }
    if (fark > cfg.maxDays) { return "far"; }
    if (cfg.closed.indexOf(iso) !== -1) { return "closed"; }
    if (cfg.hours.days.indexOf(isoWeekday(iso)) === -1) { return "day"; }
    return "";
  }
  /* ayın haftaları: her satır 7 hücre (iso ya da "") — basla = ISO hafta günü (1 Pzt … 7 Paz) */
  function ayHaftalari(y, m, basla) {
    var ilk = isoOf(y, m, 1);
    var bos = (isoWeekday(ilk) - basla + 7) % 7;
    var gun = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var hf = [], satir = [], i;
    for (i = 0; i < bos; i++) { satir.push(""); }
    for (i = 1; i <= gun; i++) {
      satir.push(isoOf(y, m, i));
      if (satir.length === 7) { hf.push(satir); satir = []; }
    }
    if (satir.length) {
      while (satir.length < 7) { satir.push(""); }
      hf.push(satir);
    }
    return hf;
  }
  /* saat dilimleri: sure dk; mola ile çakışanlar ve (bugünse) geçmiş saatler elenir; dolu = [ "14:30", … ] */
  function slotUret(h, sureDk, simdiDk, dolu) {
    var bas = hmToMin(h.start), bit = hmToMin(h.end), adim = h.slot > 0 ? h.slot : 30, out = [];
    if (isNaN(bas) || isNaN(bit)) { return out; }
    for (var t = bas; t + sureDk <= bit; t += adim) {
      var molada = false;
      var br = h.breaks || [];
      for (var i = 0; i < br.length; i++) {
        var bb = hmToMin(br[i].start), be = hmToMin(br[i].end);
        if (t < be && t + sureDk > bb) { molada = true; }
      }
      if (molada) { continue; }
      if (simdiDk !== null && t <= simdiDk) { continue; }
      var hm = minToHm(t);
      out.push({ t: hm, dk: t, dolu: (dolu || []).indexOf(hm) !== -1 });
    }
    return out;
  }
  /* sabah < 12:00 ≤ öğleden sonra < 17:00 ≤ akşam */
  function dilimOf(dk) { return dk < 720 ? "morning" : (dk < 1020 ? "afternoon" : "evening"); }
  function rakamLatin(s) {
    return String(s == null ? "" : s)
      .replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 1632); })
      .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 1776); });
  }
  function telGecerli(s) {
    var t = rakamLatin(s).trim();
    if (!/^[+\d\s().\-]+$/.test(t)) { return false; }
    var n = t.replace(/\D/g, "").length;
    return n >= 10 && n <= 15;
  }
  function epostaGecerli(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || "").trim()); }
  /* wa.me numarası: yalnız rakam, ülke koduyla (0xxx → 90xxx, 5xxxxxxxxx → 905xxxxxxxxx, 00 öneki atılır) */
  function waNumara(s) {
    var d = rakamLatin(s).replace(/\D/g, "");
    if (d.indexOf("00") === 0) { return d.slice(2); }
    if (d.length === 11 && d.charAt(0) === "0") { return "90" + d.slice(1); }
    if (d.length === 10 && d.charAt(0) === "5") { return "90" + d; }
    return d;
  }
  function sablon(str, v) {

      tbl.appendChild(thead);
      var tbody = document.createElement("tbody");
      for (i = 0; i < haftalar.length; i++) {
        var tr = document.createElement("tr");
        for (j = 0; j < 7; j++) {
          var iso = haftalar[i][j];
          var td = document.createElement("td");
          td.setAttribute("role", "gridcell");
          if (iso) {
            var d = gunDurum(CFG, iso, BUGUN);
            var acik = d === "";
            var b = e("button", "modulex-rf-day" + (acik ? "" : " modulex-rf-day-off") + (iso === S.date ? " modulex-rf-day-sel" : "") + (iso === BUGUN ? " modulex-rf-day-today" : ""), String(parseIso(iso).d));
            b.type = "button";
            b.setAttribute("data-iso", iso);
            b.tabIndex = iso === S.odak ? 0 : -1;
            b.setAttribute("aria-label", fmtTarih(iso, "full") + (acik ? "" : ", " + T.dayUnavailable));
            if (!acik) { b.setAttribute("aria-disabled", "true"); }
            if (iso === BUGUN) { b.setAttribute("aria-current", "date"); }
            td.setAttribute("aria-selected", iso === S.date ? "true" : "false");
            td.appendChild(b);
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      secili.textContent = S.date ? sablon(T.selectedDate, { d: fmtTarih(S.date, "full") }) : "";
      if (odakla) {
        var hedef = tbl.querySelector('button[data-iso="' + S.odak + '"]');
        if (hedef) { hedef.focus(); }
      }
    }

    function aySec(d) {
      var t = S.ay.y * 12 + (S.ay.m - 1) + d;
      S.ay = { y: Math.floor(t / 12), m: (t % 12) + 1 };
      ciz(false);
    }
    onceki.addEventListener("click", function () { aySec(-1); });
    sonraki.addEventListener("click", function () { aySec(1); });

    tbl.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("button[data-iso]") : null;
      if (!b) { return; }
      var iso = b.getAttribute("data-iso");
      S.odak = iso;
      if (gunDurum(CFG, iso, BUGUN) !== "") {
        setStatus(fmtTarih(iso, "full") + ": " + T.dayUnavailable, true);
        return;
      }
      setStatus("");
      if (S.date !== iso) { S.time = ""; }
      S.date = iso;
      ciz(true);
    });

    tbl.addEventListener("keydown", function (ev) {
      var b = ev.target.closest ? ev.target.closest("button[data-iso]") : null;
      if (!b) { return; }
      var iso = b.getAttribute("data-iso");
      var rtl = isRtl();
      var yeni = "";
      var k = ev.key;
      if (k === "ArrowLeft") { yeni = addDays(iso, rtl ? 1 : -1); }
      else if (k === "ArrowRight") { yeni = addDays(iso, rtl ? -1 : 1); }
      else if (k === "ArrowUp") { yeni = addDays(iso, -7); }
      else if (k === "ArrowDown") { yeni = addDays(iso, 7); }
      else if (k === "Home") { yeni = addDays(iso, -((isoWeekday(iso) - BASLA + 7) % 7)); }
      else if (k === "End") { yeni = addDays(iso, 6 - ((isoWeekday(iso) - BASLA + 7) % 7)); }
      else if (k === "PageUp" || k === "PageDown") {
        var p = parseIso(iso);
        var t = p.y * 12 + (p.m - 1) + (k === "PageUp" ? -1 : 1);
        var y2 = Math.floor(t / 12), m2 = (t % 12) + 1;
        var son = new Date(Date.UTC(y2, m2, 0)).getUTCDate();
        yeni = isoOf(y2, m2, Math.min(p.d, son));
      } else { return; }
      ev.preventDefault();
      /* pencere: bugün … bugün + maxDays */
      if (diffDays(yeni, BUGUN) < 0) { yeni = BUGUN; }
      if (diffDays(yeni, BUGUN) > P.maxDays) { yeni = addDays(BUGUN, P.maxDays); }
      S.odak = yeni;
      var py = parseIso(yeni);
      S.ay = { y: py.y, m: py.m };
      ciz(true);
    });

    ciz(false);
  }

  function buildTime(box) {
    baslikEkle(box, S.date ? sablon(T.timesFor, { d: fmtTarih(S.date, "full") }) : T.t_time);
    var simdi = new Date();
    var simdiDk = S.date === BUGUN ? simdi.getHours() * 60 + simdi.getMinutes() : null;
    var slotlar = S.date ? slotUret(P.hours, sureDk(), simdiDk, doluSaatler(S.date)) : [];

      S.time = "";

    }
    var okSlot = false;
    for (i = 0; i < slotlar.length; i++) { if (slotlar[i].t === S.time && !slotlar[i].dolu) { okSlot = true; } }
    if (!okSlot) { S.time = ""; }
    var gruplar = { morning: [], afternoon: [], evening: [] };
    for (i = 0; i < slotlar.length; i++) { gruplar[dilimOf(slotlar[i].dk)].push(slotlar[i]); }
    var adlar = ["morning", "afternoon", "evening"];

        }
        izgara.appendChild(b);
        butonlar.push(b);
      }
      kap.appendChild(izgara);
      box.appendChild(kap);
    }
    box.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("button[data-t]") : null;

      S.time = b.getAttribute("data-t");
      for (var q = 0; q < butonlar.length; q++) {
        butonlar[q].setAttribute("aria-pressed", butonlar[q] === b ? "true" : "false");
      }
      setStatus("");
    });

  /* ---- doğrulama ---- */
  function dogrula(id) {
    if (id === "service" && !S.svc) { setStatus(T.eService, true); return false; }
    if (id === "date" && (!S.date || gunDurum(CFG, S.date, BUGUN) !== "")) { setStatus(T.eDate, true); return false; }
    if (id === "time" && !S.time) { setStatus(T.eTime, true); return false; }
    if (id === "info") {
      var ilk = null;
      var ad = S.name.trim();
      if (ad.length < 2) { hataKoy(alanlar.name, T.eName); ilk = ilk || alanlar.name; }
      if (!telGecerli(S.phone)) { hataKoy(alanlar.phone, T.ePhone); ilk = ilk || alanlar.phone; }
      var em = S.email.trim();
      if ((P.requireEmail && !em) || (em && !epostaGecerli(em))) { hataKoy(alanlar.email, T.eEmail); ilk = ilk || alanlar.email; }
      if (ilk) { ilk.focus(); setStatus(ilk._er ? ilk._er.textContent : "", true); return false; }
    }
    if (id === "confirm" && P.mode !== "gosterim" && !S.kvkk) {
      hataKoy(alanlar.kvkk, T.eKvkk);
      alanlar.kvkk.focus();
      setStatus(T.eKvkk, true);
      return false;
    }
    setStatus("");
    return true;
  }

  function rezOlustur() {

      section: S.section || "", sectionName: sec ? sec.name : "", party: S.party, partyText: MOD === "masa" ? partyMetni(S.party) : "",
      date: S.date, time: S.time, dk: hmToMin(S.time), dur: sureDk(), name: S.name.trim(), phone: S.phone.trim(), email: S.email.trim(), note: S.note.trim(), created: Date.now()
    };

  function mesajOf(b) {

  }
  function icsOf(b) {
    var baslik = b.mode === "masa" ? sablon(T.icsSummary_masa, { party: b.partyText }) : sablon(T.icsSummary_randevu, { service: b.svcName || T.svcFallback_randevu });

  function indir(ad, icerik, tip) {
    var blob = new Blob([icerik], { type: tip });
    var url = window.URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = ad;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 600);
  }
  function eylemUrl(b) {

      return mailtoUret(P.email, konu, mesajOf(b));

    return "";

  /* ---- randevularım ---- */

    k.sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? -1 : 1; });

  /* ---- olay temsilcisi ---- */
  root.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-rf-act],[data-rf-iptal],[data-i]") : null;
    if (!t || !root.contains(t)) { return; }
    var iptal = t.getAttribute("data-rf-iptal");
    if (iptal) {
      var k = oku().filter(function (b) { return b && b.id !== iptal; });
      yaz(k);
      myCiz();
      setStatus(T.cancelled);
      return;
    }
    var idx = t.getAttribute("data-i");
    if (idx !== null && t.tagName === "BUTTON" && stepsEl.contains(t)) {
      S.adim = Number(idx);
      setStatus("");
      render(true);
      return;
    }
    var act = t.getAttribute("data-rf-act");
    if (act === "geri") { if (S.adim > 0) { S.adim -= 1; setStatus(""); render(true); } }
    else if (act === "ileri") {
      var list = stepList();
      var id = list[S.adim];
      if (!dogrula(id)) { return; }
      if (id === "confirm") { gonder(); return; }
      S.adim += 1;
      uzmanOtomatik();
      render(true);
    } else if (act === "yeni") { sifirla(); }
    else if (act === "icsindir" && S.bitti) { indir("randevu-" + S.bitti.date + ".ics", icsOf(S.bitti), "text/calendar;charset=utf-8"); }
  });

  uzmanOtomatik();
  render(false);
  myCiz();
})();
</script>
