<section class="modulex-cta">
  <div class="modulex-cta-container">
    <div class="modulex-cta-content">
      <h2 class="modulex-cta-title">{{title}}</h2>
      <p class="modulex-cta-desc">{{description}}</p>
    </div>
    <div class="modulex-cta-actions">
      <a href="{{btn1Url}}" class="modulex-cta-btn modulex-cta-btn-primary">
        <span>{{btn1Text}}</span>
        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
      </a>
      <a href="{{btn2Url}}" class="modulex-cta-btn modulex-cta-btn-secondary">
        <span>{{btn2Text}}</span>
      </a>
    </div>
  </div>
</section>

<style>
  .modulex-cta {
    width: 100%;
    padding: 64px 20px;
    background: --gradient--;
    box-sizing: border-box;
    overflow: hidden;
  }

  .modulex-cta-container {
    max-width: --max--;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    flex-wrap: wrap;
    animation: modulexCtaIn 0.6s ease both;
  }

  .modulex-cta-content {
    flex: 1;
    min-width: 260px;
  }

  .modulex-cta-title {
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    margin: 0 0 10px;
    line-height: 1.25;
  }

  .modulex-cta-desc {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.85);
    margin: 0;
    line-height: 1.7;
  }

  .modulex-cta-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .modulex-cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 13px 28px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    box-sizing: border-box;
  }

  .modulex-cta-btn-primary {
    background: --btnbg--;
    color: --btncolor-- !important;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }

  a.modulex-cta-btn-primary,
  .modulex-cta-btn-primary {
    color: --btncolor-- !important;
  }

  .modulex-cta-btn-primary > *,
  .modulex-cta-btn-primary .material-symbols-outlined {
    color: inherit !important;
  }

  .modulex-cta-btn-primary:hover {
    background-color: #E9F3FB;
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
  }

  .modulex-cta-btn-secondary {
    background: rgba(255, 255, 255, 0.14);
    color: #FFFFFF !important;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
  }

  a.modulex-cta-btn-secondary,
  .modulex-cta-btn-secondary {
    color: #FFFFFF !important;
  }

  .modulex-cta-btn-secondary > *,
  .modulex-cta-btn-secondary .material-symbols-outlined {
    color: #FFFFFF !important;
  }

  .modulex-cta-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.24);
    transform: translateY(-3px);
  }

  @keyframes modulexCtaIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 768px) {
    .modulex-cta {
      padding: 44px 14px;
    }

    .modulex-cta-container {
      flex-direction: column;
      align-items: flex-start;
    }

    .modulex-cta-title {
      font-size: 24px;
    }

    .modulex-cta-actions {
      width: 100%;
    }

    .modulex-cta-btn {
      flex: 1;
      min-width: 140px;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
